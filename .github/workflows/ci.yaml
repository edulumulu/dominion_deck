name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: github.event_name == 'pull_request'
        with:
          pytest-xml-coverage-path: ./backend/coverage.xml
          title: Backend Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Frontend — gate rápida ────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  # ── Frontend — tests unitarios ───────────────────────────────────────────────
  frontend-unit-tests:
    name: Frontend — unit tests + coverage
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run --coverage
      - name: Coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: frontend

  # ── Frontend — build ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Seguridad ─────────────────────────────────────────────────────────────────
  security:
    name: Security — secrets + CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detecta secretos hardcodeados en todo el historial de git
      - name: Gitleaks — secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Escanea dependencias e imagen Docker en busca de CVEs
      - name: Trivy — dependency + Docker scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Auditoría de paquetes npm (frontend)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: npm audit — frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      # Auditoría de paquetes pip (backend)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install pip-audit && pip install -r backend/requirements.txt
      - name: pip-audit — backend dependencies
        run: pip-audit -r backend/requirements.txt --severity high

  # ── Integración: health check + E2E ──────────────────────────────────────────
  integration:
    name: Integration — health check + E2E
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests, frontend-build]
    env:
      DB_PASSWORD: ci_test_password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build --no-cache
      - run: docker compose up -d --wait
      - run: chmod +x healthcheck.sh && ./healthcheck.sh http://localhost
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
