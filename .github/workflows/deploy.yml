name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    # Solo desplegamos si CI pasó y fue disparado por un push (no por un PR)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend → staging
        if: github.event.workflow_run.head_branch == 'develop'
        working-directory: backend
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BACKEND_DEV }}

      - name: Deploy backend → production
        if: github.event.workflow_run.head_branch == 'main'
        working-directory: backend
        run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BACKEND_PROD }}

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy frontend → staging
        if: github.event.workflow_run.head_branch == 'develop'
        working-directory: frontend
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND_DEV }}

      - name: Deploy frontend → production
        if: github.event.workflow_run.head_branch == 'main'
        working-directory: frontend
        run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND_PROD }}
