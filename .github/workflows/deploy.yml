name: Deploy

on:
  push:
    branches: [main, develop]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend → staging
        if: github.ref == 'refs/heads/develop'
        working-directory: backend
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BACKEND_DEV }}

      - name: Deploy backend → production
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BACKEND_PROD }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy frontend → staging
        if: github.ref == 'refs/heads/develop'
        working-directory: frontend
        run: flyctl deploy --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND_DEV }}

      - name: Deploy frontend → production
        if: github.ref == 'refs/heads/main'
        working-directory: frontend
        run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND_PROD }}
