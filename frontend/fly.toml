# fly.toml - production
app = 'dominion-deck'
primary_region = 'cdg'

[build]

[env]
  BACKEND_URL = "http://dominion-deck-api.internal:8000"
  DNS_RESOLVER = "[fdaa::3]"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
